name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p tsconfig.node.json
      - name: Build application bundles
        run: npm run build
      - name: Source and compiled security regression tests
        run: node --test tests/*.test.cjs
      - name: Rebuild touchpad native module for the pinned Electron runtime
        run: npm run build:native
      - name: Package Windows installer without publishing
        run: npx --no-install electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged application contents
        run: node scripts/verify-windows-package.cjs
      - name: Install, exercise and uninstall on disposable Windows runner
        run: node scripts/smoke-installed-windows.cjs
      - name: Upload installed application smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installed-smoke
          path: release/installed-smoke/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7
      - name: Upload reviewed installer for release inspection
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/package-verification.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  attest:
    # PR code never receives signing credentials. Only attest the installer
    # produced by the successful build job in this exact trusted push run.
    if: github.repository == 'YunhuPark/trackpad-controller' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the verified installer from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: release
      - name: Attest the exact installer bytes without a long-lived signing key
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*.exe
